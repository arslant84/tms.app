[flake8]
max-line-length = 120
extend-ignore = E203, W503
per-file-ignores =
    # Settings files use star imports by design
    tms_project/settings/*.py: F401, F403, F405, E402
    # views.py has legacy import ordering and unused imports from earlier refactors
    accounts/views.py: F401, E402, E722, E501
exclude =
    migrations,
    venv,
    .git,
    __pycache__,
