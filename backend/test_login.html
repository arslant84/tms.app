<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Test Login</h1>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="admin@tms.com">
    </div>
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="Admin@123">
    </div>
    <div class="form-group">
        <label for="endpoint">Endpoint URL:</label>
        <input type="text" id="endpoint" value="http://localhost:8000/token">
    </div>
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = document.getElementById('endpoint').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                // Create form data
                const formData = new URLSearchParams();
                formData.append('username', email);  // FastAPI OAuth2 expects 'username'
                formData.append('password', password);
                
                console.log('Sending request to:', endpoint);
                console.log('With credentials:', { email });
                
                // Make the request
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });
                
                console.log('Response status:', response.status);
                
                // Parse the response
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = 'Login successful!\n\n' + JSON.stringify(data, null, 2);
                    
                    // Test a protected endpoint if login was successful
                    if (data.access_token) {
                        await testProtectedEndpoint(endpoint.replace('/token', '/users/me'), data.access_token);
                    }
                } else {
                    resultDiv.innerHTML = 'Login failed!\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = 'Error: ' + error.message;
            }
        }
        
        async function testProtectedEndpoint(url, token) {
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Testing protected endpoint:', url);
                
                // Make the request with the token
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                console.log('Protected endpoint status:', response.status);
                
                // Parse the response
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML += '\n\nProtected endpoint access successful!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.innerHTML += '\n\nProtected endpoint access failed!\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error('Error accessing protected endpoint:', error);
                resultDiv.innerHTML += '\n\nError accessing protected endpoint: ' + error.message;
            }
        }
    </script>
</body>
</html>
