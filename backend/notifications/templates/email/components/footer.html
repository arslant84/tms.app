<!-- Email Footer Component -->
<!-- Design: Light gray background with signature and disclaimer -->

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="background-color: #f9fafb; padding: 24px; border-top: 1px solid #e5e7eb;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td align="center">
                        <!-- Signature -->
                        <p style="margin: 0; padding: 0; color: #6b7280; font-size: 13px; line-height: 1.5;">
                            Thank you,<br>
                            <strong style="color: #1f2937; font-weight: 600;">The TMS Team</strong>
                        </p>

                        <!-- Disclaimer -->
                        <p style="margin: 16px 0 0 0; padding: 0; color: #9ca3af; font-size: 12px; line-height: 1.4;">
                            This is an automated notification from the Travel Management System.
                        </p>

                        <!-- Optional: Contact Info -->
                        {% if show_contact_info %}
                        <p style="margin: 12px 0 0 0; padding: 0; color: #9ca3af; font-size: 11px; line-height: 1.4;">
                            Questions? Contact us at <a href="mailto:support@tms.com" style="color: #0d9488; text-decoration: none;">support@tms.com</a>
                        </p>
                        {% endif %}

                        <!-- Optional: Unsubscribe Link -->
                        {% if show_unsubscribe %}
                        <p style="margin: 12px 0 0 0; padding: 0; color: #9ca3af; font-size: 11px; line-height: 1.4;">
                            <a href="{{ unsubscribe_url }}" style="color: #9ca3af; text-decoration: underline;">Manage notification preferences</a>
                        </p>
                        {% endif %}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
