<!-- Sidebar - Matching React pctsb.syntra design -->
<div class="sidebar-container">
  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <!-- Main Navigation Items -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"
      class="nav-item"
      [attr.title]="'Dashboard'">
      <i class="bi bi-house"></i>
      <span class="nav-label">Dashboard</span>
    </a>

    <a
      routerLink="/trf"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="'Travel Requests'">
      <i class="bi bi-file-text"></i>
      <span class="nav-label">Travel Requests</span>
    </a>

    <a
      routerLink="/transport"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="'Transport Requests'">
      <i class="bi bi-truck"></i>
      <span class="nav-label">Transport Requests</span>
    </a>

    <a
      routerLink="/visa"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="'Visa Applications'">
      <i class="bi bi-file-earmark-text"></i>
      <span class="nav-label">Visa Applications</span>
    </a>

    <a
      routerLink="/accommodation"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="'Accommodation Requests'">
      <i class="bi bi-building"></i>
      <span class="nav-label">Accommodation Requests</span>
    </a>

    <a
      routerLink="/claims"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="'Expense Claims'">
      <i class="bi bi-receipt"></i>
      <span class="nav-label">Expense Claims</span>
    </a>

    <!-- Admin Items (Conditional) -->
    <ng-container *ngIf="hasApprovalPermissions || hasAdminPermissions">
      <div class="nav-divider"></div>

      <a
        *ngIf="hasApprovalPermissions"
        routerLink="/approvals"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="'Approvals'">
        <i class="bi bi-check-square"></i>
        <span class="nav-label">Approvals</span>
        <span class="nav-badge" *ngIf="pendingApprovals > 0">{{ pendingApprovals }}</span>
      </a>

      <a
        *ngIf="hasAdminPermissions"
        routerLink="/admin/clerk-panel"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="'Clerk Panel'">
        <i class="bi bi-people"></i>
        <span class="nav-label">Clerk Panel</span>
      </a>

      <a
        *ngIf="hasAdminPermissions"
        routerLink="/admin/reports"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="'Reports'">
        <i class="bi bi-bar-chart"></i>
        <span class="nav-label">Reports</span>
      </a>
    </ng-container>
  </nav>
</div>
