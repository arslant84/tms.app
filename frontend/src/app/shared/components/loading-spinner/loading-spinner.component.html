<div
  class="loading-spinner-container"
  [class.overlay]="overlay"
  [class.full-screen]="fullScreen"
  role="status"
  [attr.aria-live]="fullScreen || overlay ? 'polite' : null"
>
  <div class="loading-content" [ngClass]="'size-' + size">
    <span class="loading-ring" [ngClass]="'size-' + size" aria-hidden="true"></span>
    <p *ngIf="message" class="loading-message">{{ message }}</p>
    <span *ngIf="!message" class="visually-hidden">Loading</span>
  </div>
</div>
