<div [formGroup]="form">
  <div formArrayName="items">
    <div
      *ngFor="let item of itemsArray.controls; let i = index"
      [formGroupName]="i"
      class="advance-amount-item position-relative">

      <button
        *ngIf="itemsArray.length > 1"
        type="button"
        (click)="removeItem(i)"
        class="position-absolute top-0 end-0 m-2 btn btn-sm btn-outline-danger">
        <i class="bi bi-trash"></i>
      </button>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Date From / Дата с <span class="text-danger">*</span></label>
          <input
            type="date"
            formControlName="dateFrom"
            class="form-control"
            [ngClass]="{'is-invalid': item.get('dateFrom')?.invalid && item.get('dateFrom')?.touched}">
          <div class="invalid-feedback" *ngIf="item.get('dateFrom')?.errors?.['required'] && item.get('dateFrom')?.touched">
            Date from is required
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date To / Дата по <span class="text-danger">*</span></label>
          <input
            type="date"
            formControlName="dateTo"
            class="form-control"
            [ngClass]="{'is-invalid': item.get('dateTo')?.invalid && item.get('dateTo')?.touched}">
          <div class="invalid-feedback" *ngIf="item.get('dateTo')?.errors?.['required'] && item.get('dateTo')?.touched">
            Date to is required
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">LH</label>
          <input type="number" formControlName="lh" min="0" class="form-control">
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">MA</label>
          <input type="number" formControlName="ma" min="0" class="form-control">
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">OA</label>
          <input type="number" formControlName="oa" min="0" class="form-control">
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">TR</label>
          <input type="number" formControlName="tr" min="0" class="form-control">
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">OE</label>
          <input type="number" formControlName="oe" min="0" class="form-control">
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label class="form-label">USD</label>
          <input type="number" formControlName="usd" step="0.01" class="form-control bg-light">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Remarks / Примечания</label>
        <input type="text" formControlName="remarks" placeholder="Remarks for this advance item" class="form-control">
      </div>
    </div>
  </div>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary" (click)="addItem()">
      <i class="bi bi-plus-circle me-1"></i> Add Advance Item
    </button>
  </div>
</div>
