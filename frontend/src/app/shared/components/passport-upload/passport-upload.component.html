<div>
  <div *ngIf="!displayFileName && !displayFileUrl" class="border rounded p-4 text-center bg-light">
    <label [for]="inputId" class="d-block mb-0" style="cursor: pointer;">
      <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
      <span class="d-block mt-2">Click to upload or drag and drop</span>
      <span class="d-block text-muted small">PDF, JPG, PNG (max 10MB)</span>
    </label>
    <input
      type="file"
      [id]="inputId"
      class="d-none"
      accept=".pdf,.jpg,.jpeg,.png"
      (change)="onFileSelected($event)">
  </div>

  <!-- File Preview -->
  <div *ngIf="displayFileName || displayFileUrl" class="p-3 border rounded bg-light">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <i class="bi bi-file-earmark-pdf fs-3 text-danger me-3" *ngIf="displayFileName?.endsWith('.pdf')"></i>
        <i class="bi bi-file-earmark-image fs-3 text-primary me-3" *ngIf="!displayFileName?.endsWith('.pdf')"></i>
        <div>
          <div class="fw-medium">{{ displayFileName }}</div>
          <a *ngIf="displayFileUrl" [href]="displayFileUrl" target="_blank" class="small text-primary">
            <i class="bi bi-eye me-1"></i>View current file
          </a>
        </div>
      </div>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeFile()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="fileError" class="alert alert-danger mt-2 py-2">
    <i class="bi bi-exclamation-triangle me-1"></i>
    {{ fileError }}
  </div>
</div>
