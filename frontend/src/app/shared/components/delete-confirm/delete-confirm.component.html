<div class="modal fade show" style="display: flex;" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" (click)="onCancel()" [disabled]="isSaving" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">{{ message }} "{{ itemName }}"?</p>
        <p class="text-muted small mb-0">
          This action cannot be undone. The item will be permanently removed.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSaving">
          Cancel
        </button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()" [disabled]="isSaving">
          <app-loading-spinner *ngIf="isSaving" size="sm" class="me-2 d-inline-block"></app-loading-spinner>
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
