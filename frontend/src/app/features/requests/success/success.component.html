<div class="success-container">
  <div class="success-card">
    <div class="success-icon">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    <h2>Success!</h2>
    <p class="success-message">{{ successMessage }}</p>
    <div class="success-actions">
      <button class="btn btn-primary" (click)="createNewRequest()">Create Another Request</button>
      <button class="btn btn-outline-secondary" (click)="goToRequests()">Go to Dashboard</button>
    </div>
  </div>
</div>
