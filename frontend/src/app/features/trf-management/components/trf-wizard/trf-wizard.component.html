<!-- TRF Wizard - Matching React Design -->
<div class="trf-wizard-container">
  <!-- Loading State (Edit Mode) -->
  <div *ngIf="isLoadingTrf" class="loading-overlay">
    <app-loading-spinner size="md" message="Loading TRF data..."></app-loading-spinner>
  </div>

  <!-- Page Header -->
  <div class="page-header" *ngIf="!isLoadingTrf">
    <h1 class="page-title">
      {{ isEditMode ? 'Edit ' : 'New ' }}
      <span *ngIf="selectedTravelType === 'Domestic'">Domestic Travel Request</span>
      <span *ngIf="selectedTravelType === 'Overseas'">Overseas Travel Request</span>
      <span *ngIf="selectedTravelType === 'Home Leave'">Home Leave Passage Request</span>
      <span *ngIf="selectedTravelType === 'External Parties'">External Parties Travel Request</span>
    </h1>
    <p class="page-subtitle">Follow the steps to complete your travel & service request.</p>
  </div>

  <!-- Stepper Navigation -->
  <app-trf-stepper
    [currentStep]="currentStep"
    [steps]="stepLabels"
    [completedSteps]="completedSteps"
    (stepClick)="onStepClick($event)">
  </app-trf-stepper>

  <!-- Form Content -->
  <div class="wizard-content">
    <!-- Step 1: Requestor Information -->
    <!-- [hidden] rather than *ngIf: final submit validates every step via
         @ViewChild references, which would go stale (undefined) if a step's
         component were destroyed after navigating away from it. -->
    <div class="step-content" [hidden]="currentStep !== 1">
      <app-requestor-information
        [initialData]="requestorData"
        (formSubmit)="onRequestorSubmit($event)">
      </app-requestor-information>
    </div>

    <!-- Step 2: Travel Details (Dynamic based on type) -->
    <div class="step-content" [hidden]="currentStep !== 2">
      <app-domestic-travel-details
        *ngIf="selectedTravelType === 'Domestic'"
        [initialData]="domesticTravelData"
        (formSubmit)="onTravelDetailsSubmit($event)"
        (backClick)="onPrevious()">
      </app-domestic-travel-details>
      <app-overseas-travel-details
        *ngIf="selectedTravelType === 'Overseas'"
        [initialData]="overseasTravelData"
        (formSubmit)="onTravelDetailsSubmit($event)"
        (backClick)="onPrevious()">
      </app-overseas-travel-details>
      <app-home-leave-details
        *ngIf="selectedTravelType === 'Home Leave'"
        [initialData]="homeLeaveData"
        (formSubmit)="onTravelDetailsSubmit($event)"
        (backClick)="onPrevious()">
      </app-home-leave-details>
      <app-external-parties-details
        *ngIf="selectedTravelType === 'External Parties'"
        [initialData]="externalPartiesData"
        (formSubmit)="onTravelDetailsSubmit($event)"
        (backClick)="onPrevious()">
      </app-external-parties-details>
    </div>

    <!-- Step 3: Approval & Submission -->
    <div class="step-content" [hidden]="currentStep !== 3">
      <!-- Gated on selectedTravelType, same as step 2's sub-components: in edit
           mode this resolves asynchronously after the existing TRF loads, and
           the component has no ngOnChanges to react to travelType arriving late. -->
      <app-approval-submission
        *ngIf="selectedTravelType"
        [travelType]="selectedTravelType"
        [requestorData]="requestorData"
        [travelDetails]="getTravelDetailsForApproval()"
        [initialData]="approvalData"
        [requesterStaffId]="requestorData.staffId"
        (formSubmit)="onSubmit()"
        (backClick)="onPrevious()">
      </app-approval-submission>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="submitError">
      <i class="bi bi-exclamation-circle"></i>
      <span>{{ submitError }}</span>
    </div>
  </div>

  <!-- Global Actions (Cancel & Save Draft) -->
  <div class="wizard-global-actions mt-3">
    <button
      type="button"
      class="btn btn-danger me-2"
      (click)="onCancel()"
      [disabled]="isSubmitting">
      <i class="bi bi-x-circle me-1"></i>
      Cancel
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="onSaveDraft()"
      [disabled]="isSubmitting">
      <i class="bi bi-save me-1"></i>
      Save Draft
    </button>
  </div>
</div>
