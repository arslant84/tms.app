<form [formGroup]="homeLeaveForm" (ngSubmit)="onSubmit()" class="space-y-8">
  <div class="w-full rounded-lg border border-gray-200 bg-white shadow-lg">
    <!-- Card Header -->
    <div class="border-b border-gray-200 px-6 py-4">
      <h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900">
        <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        Home Leave Passage Details
      </h2>
      <p class="mt-1 text-sm text-gray-500">Please provide details for your home leave passage.</p>
    </div>

    <!-- Card Content -->
    <div class="space-y-8 px-6 py-6">
      <!-- Purpose -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">
          Purpose of Travel / Цель поездки <span class="text-red-500">*</span>
        </label>
        <textarea
          formControlName="purpose"
          rows="3"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Describe the purpose of your home leave"
        ></textarea>
        <div *ngIf="homeLeaveForm.get('purpose')?.invalid && homeLeaveForm.get('purpose')?.touched" class="text-sm text-red-600">
          Purpose must be at least 10 characters
        </div>
      </div>

      <!-- Passport Details -->
      <div class="space-y-4" formGroupName="passportDetails">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
          </svg>
          Passport Details / Паспортные данные
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Full Name <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="fullName"
              placeholder="As per passport"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Passport Number <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="passportNumber"
              placeholder="Enter passport number"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Nationality <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="nationality"
              placeholder="e.g., Turkmen"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Date of Birth <span class="text-red-500">*</span></label>
            <input
              type="date"
              formControlName="dateOfBirth"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Place of Birth</label>
            <input
              type="text"
              formControlName="placeOfBirth"
              placeholder="City, Country"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Passport Issue Date <span class="text-red-500">*</span></label>
            <input
              type="date"
              formControlName="passportIssueDate"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Passport Expiry Date <span class="text-red-500">*</span></label>
            <input
              type="date"
              formControlName="passportExpiryDate"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>

      <!-- Itinerary -->
      <div class="space-y-4">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
          Itinerary / Маршрут
        </h3>

        <div formArrayName="itinerary" class="space-y-4">
          <div *ngFor="let segment of itinerary.controls; let i = index" [formGroupName]="i" class="relative rounded-md border border-gray-200 bg-gray-50/50 p-4 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Date <span class="text-red-500">*</span></label>
                <input
                  type="date"
                  formControlName="date"
                  (change)="onDateChange(i, $event)"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Day</label>
                <div class="flex h-10 w-full items-center rounded-md border border-gray-300 bg-gray-100/50 px-3 text-sm text-gray-700">
                  {{ segment.get('day')?.value || '—' }}
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">From <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="from"
                  placeholder="Origin"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">To <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="to"
                  placeholder="Destination"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Flight Number</label>
                <input
                  type="text"
                  formControlName="flightNumber"
                  placeholder="e.g., LH1234"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">Remarks</label>
              <textarea
                formControlName="remarks"
                rows="2"
                placeholder="Any additional information"
                class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
              ></textarea>
            </div>

            <button
              *ngIf="itinerary.length > 1"
              type="button"
              (click)="removeItinerarySegment(i)"
              class="absolute top-2 right-2 rounded p-1 text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addItinerarySegment()"
          class="inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Add Segment
        </button>
      </div>

      <!-- Bank Details (Optional) -->
      <div class="space-y-4" formGroupName="advanceBankDetails">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path>
          </svg>
          Bank Details (Optional)
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Bank Name</label>
            <input
              type="text"
              formControlName="bankName"
              placeholder="Enter bank name"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Account Number</label>
            <input
              type="text"
              formControlName="accountNumber"
              placeholder="Enter account number"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="flex justify-between border-t border-gray-200 px-6 py-4">
      <button
        type="button"
        class="inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors"
      >
        Back: Requestor Info
      </button>
      <button
        type="submit"
        class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 transition-colors"
      >
        Next: Approval & Submission
      </button>
    </div>
  </div>
</form>
