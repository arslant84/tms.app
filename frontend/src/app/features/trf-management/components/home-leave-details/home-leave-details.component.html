<form [formGroup]="homeLeaveForm" (ngSubmit)="onSubmit()">
  <div class="card shadow">
    <!-- Card Header -->
    <div class="card-header bg-light border-bottom">
      <h2 class="d-flex align-items-center gap-2 mb-2 fw-semibold">
        <i class="bi bi-house text-primary" style="font-size: 1.25rem;"></i>
        Home Leave Passage Details
      </h2>
      <p class="text-muted small mb-0">Please provide details for your home leave passage.</p>
    </div>

    <!-- Card Body -->
    <div class="card-body">
      <!-- Purpose -->
      <div class="mb-4">
        <label class="form-label fw-medium">
          Purpose of Travel / Цель поездки <span class="text-danger">*</span>
        </label>
        <textarea
          formControlName="purpose"
          rows="3"
          class="form-control"
          placeholder="Describe the purpose of your home leave"
        ></textarea>
        <div *ngIf="homeLeaveForm.get('purpose')?.invalid && homeLeaveForm.get('purpose')?.touched" class="text-danger small mt-1">
          Purpose must be at least 10 characters
        </div>
      </div>

      <!-- Passport Details -->
      <div class="mb-4" formGroupName="passportDetails">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-passport text-primary"></i>
          Passport Details / Паспортные данные
        </h3>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Full Name <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="fullName"
              placeholder="As per passport"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Passport Number <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="passportNumber"
              placeholder="Enter passport number"
              class="form-control"
            />
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Nationality <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="nationality"
              placeholder="e.g., Turkmen"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Date of Birth <span class="text-danger">*</span></label>
            <input
              type="date"
              formControlName="dateOfBirth"
              class="form-control"
            />
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label fw-medium">Place of Birth</label>
            <input
              type="text"
              formControlName="placeOfBirth"
              placeholder="City, Country"
              class="form-control"
            />
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Passport Issue Date <span class="text-danger">*</span></label>
            <input
              type="date"
              formControlName="passportIssueDate"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Passport Expiry Date <span class="text-danger">*</span></label>
            <input
              type="date"
              formControlName="passportExpiryDate"
              class="form-control"
            />
          </div>
        </div>
      </div>

      <!-- Itinerary -->
      <div class="mb-4">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-map text-primary"></i>
          Itinerary / Маршрут
        </h3>

        <div formArrayName="itinerary">
          <div *ngFor="let segment of itinerary.controls; let i = index" [formGroupName]="i" class="position-relative border rounded bg-light p-3 mb-3">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  formControlName="date"
                  (change)="onDateChange(i, $event)"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Day</label>
                <div class="form-control bg-secondary bg-opacity-10">
                  {{ segment.get('day')?.value || '—' }}
                </div>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">From <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="from"
                  placeholder="Origin"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">To <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="to"
                  placeholder="Destination"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Flight Number</label>
                <input
                  type="text"
                  formControlName="flightNumber"
                  placeholder="e.g., LH1234"
                  class="form-control"
                />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Remarks</label>
              <textarea
                formControlName="remarks"
                rows="2"
                placeholder="Any additional information"
                class="form-control"
              ></textarea>
            </div>

            <button
              *ngIf="itinerary.length > 1"
              type="button"
              (click)="removeItinerarySegment(i)"
              class="position-absolute top-0 end-0 m-2 btn btn-sm btn-outline-danger"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addItinerarySegment()"
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
        >
          <i class="bi bi-plus-circle"></i>
          Add Segment
        </button>
      </div>

      <!-- Bank Details (Optional) -->
      <div class="mb-4" formGroupName="advanceBankDetails">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-bank text-primary"></i>
          Bank Details (Optional)
        </h3>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Bank Name</label>
            <input
              type="text"
              formControlName="bankName"
              placeholder="Enter bank name"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Account Number</label>
            <input
              type="text"
              formControlName="accountNumber"
              placeholder="Enter account number"
              class="form-control"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="card-footer bg-light border-top d-flex justify-content-between">
      <button
        type="button"
        class="btn btn-outline-secondary d-inline-flex align-items-center gap-2"
      >
        <i class="bi bi-arrow-left"></i>
        Back: Requestor Info
      </button>
      <button
        type="submit"
        class="btn btn-primary d-inline-flex align-items-center gap-2"
      >
        Next: Approval & Submission
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </div>
</form>
