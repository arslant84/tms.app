<div class="travel-form-container">
  <form [formGroup]="homeLeaveForm" (ngSubmit)="onSubmit()">
    <!-- Purpose of Travel Section -->
    <app-form-section-card icon="bi-file-text" title="Purpose of Travel / Цель поездки">
        <div class="form-group mb-3">
          <label for="purpose" class="form-label">Please describe the purpose of your home leave <span class="text-danger">*</span></label>
          <textarea
            class="form-control"
            id="purpose"
            formControlName="purpose"
            rows="3"
            placeholder="Describe the purpose of your home leave"
            [ngClass]="{'is-invalid': homeLeaveForm.get('purpose')?.invalid && homeLeaveForm.get('purpose')?.touched}"></textarea>
          <div class="invalid-feedback" *ngIf="homeLeaveForm.get('purpose')?.errors?.['required'] && homeLeaveForm.get('purpose')?.touched">
            Purpose of travel is required
          </div>
          <div class="invalid-feedback" *ngIf="homeLeaveForm.get('purpose')?.errors?.['minlength'] && homeLeaveForm.get('purpose')?.touched">
            Purpose must be at least 10 characters
          </div>
        </div>

        <div class="form-group">
          <label for="tripType" class="form-label d-flex align-items-center gap-2">
            <i class="bi bi-card-checklist"></i>
            Trip Type / Тип поездки <span class="text-danger">*</span>
          </label>
          <select
            id="tripType"
            formControlName="tripType"
            class="form-select"
            [ngClass]="{'is-invalid': homeLeaveForm.get('tripType')?.invalid && homeLeaveForm.get('tripType')?.touched}"
          >
            <option value="One Way">One Way</option>
            <option value="Round Trip">Round Trip</option>
          </select>
          <div class="invalid-feedback" *ngIf="homeLeaveForm.get('tripType')?.errors?.['required'] && homeLeaveForm.get('tripType')?.touched">
            Trip type is required
          </div>
        </div>
    </app-form-section-card>

    <!-- Itinerary Section -->
    <app-form-section-card icon="bi-map" title="Travel Itinerary / Маршрут">
        <app-itinerary-editor
          [fields]="itineraryFields"
          [initialSegments]="initialData.itinerary || []"
          [tripType]="tripTypeValue"
          (segmentsChange)="onItinerarySegmentsChange($event)">
        </app-itinerary-editor>
    </app-form-section-card>

    <!-- Bank Details Section -->
    <app-form-section-card icon="bi-bank" title="Bank Details (Optional)">
        <div formGroupName="advanceBankDetails">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Account Name / Имя владельца счета</label>
              <input type="text" formControlName="accountName" placeholder="Enter account holder name" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Bank Name / Название банка</label>
              <input type="text" formControlName="bankName" placeholder="Enter bank name" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Account Number / Номер счета</label>
              <input type="text" formControlName="accountNumber" placeholder="Enter account number" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Currency / Валюта</label>
              <select formControlName="currency" class="form-select">
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="TMT">TMT - Turkmen Manat</option>
                <option value="RUB">RUB - Russian Ruble</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Remarks / Примечания</label>
              <textarea formControlName="branchAddress" rows="2" placeholder="Enter any additional remarks" class="form-control"></textarea>
            </div>
          </div>
        </div>
    </app-form-section-card>

    <!-- Passport Details Section -->
    <app-form-section-card icon="bi-file-earmark-text" title="Passport Details (Optional)">
        <p class="text-muted small mb-3">
          Upload a copy of your passport for flight booking purposes. This helps the flight admin process your booking faster.
        </p>

        <!-- File Input -->
        <app-passport-upload
          inputId="passportFileHomeLeave"
          [fileName]="initialData.passportUpload?.fileName || ''"
          [fileUrl]="initialData.passportUpload?.fileUrl || ''"
          (fileSelected)="onPassportFileSelected($event)"
          (fileRemoved)="onPassportFileRemoved()">
        </app-passport-upload>
    </app-form-section-card>

    <!-- Navigation Buttons -->
    <div class="d-flex justify-content-between pt-4 mt-4 border-top">
      <button type="button" class="btn btn-outline-secondary" (click)="onBack()">
        <i class="bi bi-chevron-left me-1"></i>
        Back: Requestor Info
      </button>
      <button type="submit" class="btn btn-primary">
        Next: Approval &amp; Submission
        <i class="bi bi-chevron-right ms-1"></i>
      </button>
    </div>
  </form>
</div>
