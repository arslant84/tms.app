<!-- Travel Type Selection Page - Matching React Reference -->
<div class="container py-5">
  <div class="text-center mb-5">
    <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
      <i class="bi bi-file-earmark-plus fs-1 text-primary"></i>
      <h1 class="display-5 fw-bold mb-0">Create New Travel & Service Request</h1>
    </div>
    <p class="text-muted fs-5">Please select the type of travel request you want to create.</p>
  </div>

  <div class="travel-type-grid">
    <div
      class="card h-100 shadow-sm hover-card cursor-pointer"
      *ngFor="let option of travelTypeOptions"
      (click)="navigateToTravelType(option.route)"
      tabindex="0"
      (keydown.enter)="navigateToTravelType(option.route)"
      (keydown.space)="navigateToTravelType(option.route)"
    >
      <div class="card-body p-4">
        <div class="d-flex align-items-center gap-3 mb-3">
          <i [class]="option.icon + ' fs-1 text-primary'"></i>
          <h3 class="card-title fs-5 fw-semibold mb-0">{{ option.title }}</h3>
        </div>
        <p class="card-text text-muted">{{ option.description }}</p>
      </div>
    </div>
  </div>
</div>
