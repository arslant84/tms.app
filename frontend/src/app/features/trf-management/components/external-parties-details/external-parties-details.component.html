<form [formGroup]="externalForm" (ngSubmit)="onSubmit()" class="space-y-8">
  <div class="w-full rounded-lg border border-gray-200 bg-white shadow-lg">
    <!-- Card Header -->
    <div class="border-b border-gray-200 px-6 py-4">
      <h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900">
        <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        External Parties Details
      </h2>
      <p class="mt-1 text-sm text-gray-500">Please provide details for external party travel arrangements.</p>
    </div>

    <!-- Card Content -->
    <div class="space-y-8 px-6 py-6">
      <!-- Purpose -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">
          Purpose <span class="text-red-500">*</span>
        </label>
        <textarea
          formControlName="purpose"
          rows="3"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Describe the purpose of visit"
        ></textarea>
      </div>

      <!-- External Party Information -->
      <div class="space-y-4">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          External Party Information
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Full Name <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="externalFullName"
              placeholder="Enter full name"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Organization <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="externalOrganization"
              placeholder="Organization name"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Reference to Authority Letter</label>
            <input
              type="text"
              formControlName="externalRefToAuthorityLetter"
              placeholder="Letter reference number"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Cost Center <span class="text-red-500">*</span></label>
            <input
              type="text"
              formControlName="externalCostCenter"
              placeholder="Cost center code"
              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>

      <!-- Accommodation Details -->
      <div class="space-y-4">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
          Accommodation Details
        </h3>

        <div formArrayName="accommodation" class="space-y-4">
          <div *ngFor="let item of accommodation.controls; let i = index" [formGroupName]="i" class="relative rounded-md border border-gray-200 bg-gray-50/50 p-4 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">From Date <span class="text-red-500">*</span></label>
                <input
                  type="date"
                  formControlName="fromDate"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">To Date <span class="text-red-500">*</span></label>
                <input
                  type="date"
                  formControlName="toDate"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">From Location <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="fromLocation"
                  placeholder="Starting location"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">To Location <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="toLocation"
                  placeholder="Destination location"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Accommodation Type <span class="text-red-500">*</span></label>
                <select
                  formControlName="accommodationType"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                >
                  <option value="">Select Type</option>
                  <option value="Staff House">Staff House</option>
                  <option value="Camp">Camp</option>
                  <option value="Hotel">Hotel</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Address</label>
                <input
                  type="text"
                  formControlName="address"
                  placeholder="Accommodation address"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">Remarks</label>
              <textarea
                formControlName="remarks"
                rows="2"
                placeholder="Additional information"
                class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
              ></textarea>
            </div>

            <button
              *ngIf="accommodation.length > 1"
              type="button"
              (click)="removeAccommodation(i)"
              class="absolute top-2 right-2 rounded p-1 text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addAccommodation()"
          class="inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Add Accommodation
        </button>
      </div>

      <!-- Transport Details -->
      <div class="space-y-4">
        <h3 class="flex items-center gap-2 text-lg font-medium text-gray-900">
          <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
          </svg>
          Transport Details
        </h3>

        <div formArrayName="transport" class="space-y-4">
          <div *ngFor="let item of transport.controls; let i = index" [formGroupName]="i" class="relative rounded-md border border-gray-200 bg-gray-50/50 p-4 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Date <span class="text-red-500">*</span></label>
                <input
                  type="date"
                  formControlName="date"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">From Location <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="fromLocation"
                  placeholder="Starting point"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">To Location <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  formControlName="toLocation"
                  placeholder="Destination"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">BT No Required</label>
                <input
                  type="text"
                  formControlName="btNoRequired"
                  placeholder="BT number if required"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Remarks</label>
                <input
                  type="text"
                  formControlName="remarks"
                  placeholder="Additional notes"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 shadow-sm transition-colors focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <button
              *ngIf="transport.length > 1"
              type="button"
              (click)="removeTransport(i)"
              class="absolute top-2 right-2 rounded p-1 text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addTransport()"
          class="inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Add Transport
        </button>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="flex justify-between border-t border-gray-200 px-6 py-4">
      <button
        type="button"
        class="inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors"
      >
        Back: Requestor Info
      </button>
      <button
        type="submit"
        class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 transition-colors"
      >
        Next: Approval & Submission
      </button>
    </div>
  </div>
</form>
