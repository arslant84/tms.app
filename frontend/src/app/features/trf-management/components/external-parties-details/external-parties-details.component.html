<form [formGroup]="externalForm" (ngSubmit)="onSubmit()">
  <!-- Main Card -->
  <div class="card shadow">
    <!-- Card Header -->
    <div class="card-header bg-light border-bottom">
      <h2 class="d-flex align-items-center gap-2 mb-2 fw-semibold">
        <i class="bi bi-people text-primary" style="font-size: 1.25rem;"></i>
        External Parties Details
      </h2>
      <p class="text-muted small mb-0">Please provide details for external party travel arrangements.</p>
    </div>

    <!-- Card Body -->
    <div class="card-body">
      <!-- Purpose -->
      <div class="mb-4">
        <label class="form-label fw-medium">
          Purpose <span class="text-danger">*</span>
        </label>
        <textarea
          formControlName="purpose"
          rows="3"
          class="form-control"
          placeholder="Describe the purpose of visit"
        ></textarea>
      </div>

      <!-- Trip Type -->
      <div class="mb-4">
        <label class="form-label fw-medium d-flex align-items-center gap-2">
          <i class="bi bi-card-checklist"></i>
          Trip Type <span class="text-danger">*</span>
        </label>
        <select
          formControlName="tripType"
          class="form-select"
        >
          <option value="One Way">One Way</option>
          <option value="Round Trip">Round Trip</option>
        </select>
      </div>

      <!-- Itinerary Section -->
      <div class="mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h3 class="h5 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-map text-primary"></i>
            Travel Itinerary
          </h3>
        </div>

        <div formArrayName="itinerary">
          <div *ngFor="let segment of itinerary.controls; let i = index" [formGroupName]="i" class="position-relative border rounded bg-light p-3 mb-3">
            <!-- Date and Day -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  formControlName="departureDate"
                  (change)="onDateChange(i, $event)"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Day</label>
                <div class="form-control bg-secondary bg-opacity-10">
                  {{ segment.get('day')?.value || '—' }}
                </div>
              </div>
            </div>

            <!-- From and To -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">From <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="departureLocation"
                  placeholder="Origin city/airport"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">To <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="arrivalLocation"
                  placeholder="Destination city/airport"
                  class="form-control"
                />
              </div>
            </div>

            <!-- Times and Transport Mode -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-medium">Departure Time</label>
                <input
                  type="time"
                  formControlName="departureTime"
                  class="form-control"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">Arrival Time</label>
                <input
                  type="time"
                  formControlName="arrivalTime"
                  class="form-control"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">Mode of Transport <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="modeOfTransport"
                  placeholder="e.g., Flight, Train, Car"
                  class="form-control"
                />
              </div>
            </div>

            <!-- Remarks -->
            <div class="mb-3">
              <label class="form-label fw-medium">Remarks</label>
              <textarea
                formControlName="remarks"
                rows="2"
                placeholder="Any additional information"
                class="form-control"
              ></textarea>
            </div>

            <!-- Remove Button -->
            <button
              *ngIf="itinerary.length > 1 && externalForm.get('tripType')?.value === 'Round Trip'"
              type="button"
              (click)="removeItinerarySegment(i)"
              class="position-absolute top-0 end-0 m-2 btn btn-sm btn-outline-danger"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <button
          *ngIf="externalForm.get('tripType')?.value === 'Round Trip'"
          type="button"
          (click)="addItinerarySegment()"
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
        >
          <i class="bi bi-plus-circle"></i>
          Add Itinerary Segment
        </button>
      </div>

      <!-- External Party Information -->
      <div class="mb-4">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-person text-primary"></i>
          External Party Information
        </h3>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Full Name <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalFullName"
              placeholder="Enter full name"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Organization <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalOrganization"
              placeholder="Organization name"
              class="form-control"
            />
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Reference to Authority Letter</label>
            <input
              type="text"
              formControlName="externalRefToAuthorityLetter"
              placeholder="Letter reference number"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Cost Center <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalCostCenter"
              placeholder="Cost center code"
              class="form-control"
            />
          </div>
        </div>
      </div>

      <!-- Accommodation Details -->
      <div class="mb-4">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-building text-primary"></i>
          Accommodation Details
        </h3>

        <div formArrayName="accommodation">
          <div *ngFor="let item of accommodation.controls; let i = index" [formGroupName]="i" class="position-relative border rounded bg-light p-3 mb-3">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">From Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  formControlName="fromDate"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">To Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  formControlName="toDate"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">From Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="fromLocation"
                  placeholder="Starting location"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">To Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="toLocation"
                  placeholder="Destination location"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Accommodation Type <span class="text-danger">*</span></label>
                <select
                  formControlName="accommodationType"
                  class="form-select"
                >
                  <option value="">Select Type</option>
                  <option value="Staff House">Staff House</option>
                  <option value="Camp">Camp</option>
                  <option value="Hotel">Hotel</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Address</label>
                <input
                  type="text"
                  formControlName="address"
                  placeholder="Accommodation address"
                  class="form-control"
                />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Remarks</label>
              <textarea
                formControlName="remarks"
                rows="2"
                placeholder="Additional information"
                class="form-control"
              ></textarea>
            </div>

            <button
              *ngIf="accommodation.length > 1"
              type="button"
              (click)="removeAccommodation(i)"
              class="position-absolute top-0 end-0 m-2 btn btn-sm btn-outline-danger"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addAccommodation()"
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
        >
          <i class="bi bi-plus-circle"></i>
          Add Accommodation
        </button>
      </div>

      <!-- Transport Details -->
      <div class="mb-4">
        <h3 class="h5 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-truck text-primary"></i>
          Transport Details
        </h3>

        <div formArrayName="transport">
          <div *ngFor="let item of transport.controls; let i = index" [formGroupName]="i" class="position-relative border rounded bg-light p-3 mb-3">
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-medium">Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  formControlName="date"
                  class="form-control"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">From Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="fromLocation"
                  placeholder="Starting point"
                  class="form-control"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-medium">To Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  formControlName="toLocation"
                  placeholder="Destination"
                  class="form-control"
                />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">BT No Required</label>
                <input
                  type="text"
                  formControlName="btNoRequired"
                  placeholder="BT number if required"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Remarks</label>
                <input
                  type="text"
                  formControlName="remarks"
                  placeholder="Additional notes"
                  class="form-control"
                />
              </div>
            </div>

            <button
              *ngIf="transport.length > 1"
              type="button"
              (click)="removeTransport(i)"
              class="position-absolute top-0 end-0 m-2 btn btn-sm btn-outline-danger"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addTransport()"
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
        >
          <i class="bi bi-plus-circle"></i>
          Add Transport
        </button>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="card-footer bg-light border-top d-flex justify-content-between">
      <button
        type="button"
        class="btn btn-outline-secondary d-inline-flex align-items-center gap-2"
      >
        <i class="bi bi-arrow-left"></i>
        Back: Requestor Info
      </button>
      <button
        type="submit"
        class="btn btn-primary d-inline-flex align-items-center gap-2"
      >
        Next: Approval & Submission
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </div>
</form>
