<div class="travel-form-container">
  <form [formGroup]="externalForm" (ngSubmit)="onSubmit()">
    <!-- Purpose of Travel Section -->
    <app-form-section-card icon="bi-file-text" title="Purpose of Visit">
        <div class="form-group mb-3">
          <label for="purpose" class="form-label">Please describe the purpose of the visit <span class="text-danger">*</span></label>
          <textarea
            class="form-control"
            id="purpose"
            formControlName="purpose"
            rows="3"
            placeholder="Describe the purpose of visit"
            [ngClass]="{'is-invalid': externalForm.get('purpose')?.invalid && externalForm.get('purpose')?.touched}"></textarea>
          <div class="invalid-feedback" *ngIf="externalForm.get('purpose')?.errors?.['required'] && externalForm.get('purpose')?.touched">
            Purpose is required
          </div>
          <div class="invalid-feedback" *ngIf="externalForm.get('purpose')?.errors?.['minlength'] && externalForm.get('purpose')?.touched">
            Purpose must be at least 10 characters
          </div>
        </div>

        <div class="form-group">
          <label for="tripType" class="form-label d-flex align-items-center gap-2">
            <i class="bi bi-card-checklist"></i>
            Trip Type <span class="text-danger">*</span>
          </label>
          <select
            id="tripType"
            formControlName="tripType"
            class="form-select"
          >
            <option value="One Way">One Way</option>
            <option value="Round Trip">Round Trip</option>
          </select>
        </div>
    </app-form-section-card>

    <!-- Itinerary Section -->
    <app-form-section-card icon="bi-map" title="Travel Itinerary">
        <app-itinerary-editor
          [fields]="itineraryFields"
          [initialSegments]="initialData.itinerary || []"
          [tripType]="tripTypeValue"
          (segmentsChange)="onItinerarySegmentsChange($event)"
          (datesChange)="onItineraryDatesChange($event)">
        </app-itinerary-editor>
    </app-form-section-card>

    <!-- Meal Provisions Section -->
    <app-form-section-card icon="bi-cup-hot" title="Meal Provision">
      <app-meal-provision
        [itineraryDates]="itineraryDates"
        [initialSelections]="initialData.mealProvisions?.dailySelections || []"
        (selectionsChange)="onMealSelectionsChange($event)">
      </app-meal-provision>
    </app-form-section-card>

    <!-- External Party Information Section -->
    <app-form-section-card icon="bi-person" title="External Party Information">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Full Name <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalFullName"
              placeholder="Enter full name"
              class="form-control"
              [ngClass]="{'is-invalid': externalForm.get('externalFullName')?.invalid && externalForm.get('externalFullName')?.touched}"
            />
            <div class="invalid-feedback" *ngIf="externalForm.get('externalFullName')?.errors?.['required'] && externalForm.get('externalFullName')?.touched">
              Full name is required
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Organization <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalOrganization"
              placeholder="Organization name"
              class="form-control"
              [ngClass]="{'is-invalid': externalForm.get('externalOrganization')?.invalid && externalForm.get('externalOrganization')?.touched}"
            />
            <div class="invalid-feedback" *ngIf="externalForm.get('externalOrganization')?.errors?.['required'] && externalForm.get('externalOrganization')?.touched">
              Organization is required
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Reference to Authority Letter</label>
            <input
              type="text"
              formControlName="externalRefToAuthorityLetter"
              placeholder="Letter reference number"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Cost Center <span class="text-danger">*</span></label>
            <input
              type="text"
              formControlName="externalCostCenter"
              placeholder="Cost center code"
              class="form-control"
              [ngClass]="{'is-invalid': externalForm.get('externalCostCenter')?.invalid && externalForm.get('externalCostCenter')?.touched}"
            />
            <div class="invalid-feedback" *ngIf="externalForm.get('externalCostCenter')?.errors?.['required'] && externalForm.get('externalCostCenter')?.touched">
              Cost center is required
            </div>
          </div>
        </div>
    </app-form-section-card>

    <!-- Passport Details Section -->
    <app-form-section-card icon="bi-file-earmark-text" title="Passport Details (Optional)">
        <p class="text-muted small mb-3">
          Upload a copy of the external party's passport for flight booking purposes.
        </p>

        <!-- File Input -->
        <app-passport-upload
          inputId="passportFileExternal"
          [fileName]="initialData.passportUpload?.fileName || ''"
          [fileUrl]="initialData.passportUpload?.fileUrl || ''"
          (fileSelected)="onPassportFileSelected($event)"
          (fileRemoved)="onPassportFileRemoved()">
        </app-passport-upload>
    </app-form-section-card>

    <!-- Navigation Buttons -->
    <div class="d-flex justify-content-between pt-4 mt-4 border-top">
      <button type="button" class="btn btn-outline-secondary" (click)="onBack()">
        <i class="bi bi-chevron-left me-1"></i>
        Back: Requestor Info
      </button>
      <button type="submit" class="btn btn-primary">
        Next: Approval &amp; Submission
        <i class="bi bi-chevron-right ms-1"></i>
      </button>
    </div>
  </form>
</div>
