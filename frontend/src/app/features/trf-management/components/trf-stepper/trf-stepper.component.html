<!-- TRF Stepper - Matching React pctsb.syntra design -->
<div class="stepper-container">
  <div class="stepper">
    <ng-container *ngFor="let label of steps; let i = index">
      <button
        class="step-button"
        [class.active]="isStepActive(i + 1)"
        [class.completed]="isStepCompleted(i + 1)"
        [disabled]="!isStepClickable(i + 1)"
        (click)="isStepClickable(i + 1) && onStepClick(i + 1)">

        <!-- Check circle icon for completed steps (not active) -->
        <span class="step-icon" *ngIf="isStepCompleted(i + 1) && !isStepActive(i + 1)">
          <i class="bi bi-check-circle-fill"></i>
        </span>

        <!-- Step label -->
        <span class="step-label">
          {{ label }}
        </span>

        <!-- Separator between steps -->
        <span class="step-separator" *ngIf="i < steps.length - 1"></span>
      </button>
    </ng-container>
  </div>
</div>
