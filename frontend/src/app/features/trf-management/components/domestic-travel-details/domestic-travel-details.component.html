<div class="travel-form-container">
  <form [formGroup]="travelForm" (ngSubmit)="onSubmit()">
    <!-- Purpose of Travel Section -->
    <app-form-section-card icon="bi-file-text" title="Purpose of Travel">
        <div class="form-group mb-3">
          <label for="purposeOfTravel" class="form-label">Please describe the purpose of your travel</label>
          <textarea
            class="form-control"
            id="purposeOfTravel"
            formControlName="purposeOfTravel"
            rows="3"
            [ngClass]="{'is-invalid': travelForm.get('purposeOfTravel')?.invalid && travelForm.get('purposeOfTravel')?.touched}"></textarea>
          <div class="invalid-feedback" *ngIf="travelForm.get('purposeOfTravel')?.errors?.['required'] && travelForm.get('purposeOfTravel')?.touched">
            Purpose of travel is required
          </div>
        </div>

        <div class="form-group">
          <label for="tripType" class="form-label d-flex align-items-center gap-2">
            <i class="bi bi-card-checklist"></i>
            Trip Type <span class="text-danger">*</span>
          </label>
          <select
            id="tripType"
            formControlName="tripType"
            class="form-select"
            [ngClass]="{'is-invalid': travelForm.get('tripType')?.invalid && travelForm.get('tripType')?.touched}"
          >
            <option value="One Way">One Way</option>
            <option value="Round Trip">Round Trip</option>
          </select>
          <div class="invalid-feedback" *ngIf="travelForm.get('tripType')?.errors?.['required'] && travelForm.get('tripType')?.touched">
            Trip type is required
          </div>
        </div>
    </app-form-section-card>

    <!-- Itinerary Section -->
    <app-form-section-card icon="bi-clipboard-check" title="Itinerary">
        <app-itinerary-editor
          [fields]="itineraryFields"
          [initialSegments]="initialData.itinerary || []"
          [tripType]="tripTypeValue"
          (segmentsChange)="onItinerarySegmentsChange($event)"
          (datesChange)="onItineraryDatesChange($event)">
        </app-itinerary-editor>
    </app-form-section-card>

    <!-- Meal Provisions Section -->
    <app-form-section-card icon="bi-cup-hot" title="Meal Provision">
      <app-meal-provision
        [itineraryDates]="itineraryDates"
        [initialSelections]="initialData.mealProvisions?.dailySelections || []"
        (selectionsChange)="onMealSelectionsChange($event)">
      </app-meal-provision>
    </app-form-section-card>

    <!-- Passport Details Section -->
    <app-form-section-card icon="bi-file-earmark-text" title="Passport Details (Optional)">
        <p class="text-muted small mb-3">
          Upload a copy of your passport for flight booking purposes. This helps the flight admin process your booking faster.
        </p>

        <!-- File Input -->
        <app-passport-upload
          inputId="passportFile"
          [fileName]="initialData.passportUpload?.fileName || ''"
          [fileUrl]="initialData.passportUpload?.fileUrl || ''"
          (fileSelected)="onPassportFileSelected($event)"
          (fileRemoved)="onPassportFileRemoved()">
        </app-passport-upload>
    </app-form-section-card>

    <!-- Navigation Buttons -->
    <div class="d-flex justify-content-between pt-4 mt-4 border-top">
      <button type="button" class="btn btn-outline-secondary" (click)="onBack()">
        <i class="bi bi-chevron-left me-1"></i>
        Back: Requestor Info
      </button>
      <button type="submit" class="btn btn-primary">
        Next: Approval &amp; Submission
        <i class="bi bi-chevron-right ms-1"></i>
      </button>
    </div>
  </form>
</div>
