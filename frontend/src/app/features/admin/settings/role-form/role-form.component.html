<div class="modal fade show modal-show" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-primary">
          {{ editId ? 'Manage Role: ' + form.name : 'Add New Role' }}
        </h5>
        <button type="button" class="btn-close" (click)="cancelForm()" [disabled]="isSaving" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="submitForm()">
          <div class="mb-3">
            <label class="form-label fw-medium">Role Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="form.name" name="name" placeholder="Enter role name" required [class.is-invalid]="!form.name && submitError" />
            <div class="invalid-feedback" *ngIf="!form.name && submitError">
              Role name is required
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Description (Optional)</label>
            <textarea class="form-control" [(ngModel)]="form.description" name="description" rows="2" placeholder="Describe the role"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Assign Permissions <span class="text-danger">*</span></label>
            <div class="permissions-form-scroll border rounded p-3" [class.border-danger]="(form.permissionIds?.length || 0) === 0 && submitError">
              <div *ngIf="permissions.length === 0" class="text-center text-muted py-3">
                <p class="mb-0 small">No permissions available</p>
              </div>
              <div *ngFor="let p of permissions" class="form-check mb-3">
                <input class="form-check-input" type="checkbox" [id]="'perm-' + p.id" [checked]="form.permissionIds?.includes(p.id)" (change)="togglePermission(p.id)" />
                <label class="form-check-label small" [for]="'perm-' + p.id">
                  {{ p.name }}
                  <span class="d-block text-muted text-xs" *ngIf="p.description">{{ p.description }}</span>
                </label>
              </div>
            </div>
            <div class="form-text small text-danger" *ngIf="(form.permissionIds?.length || 0) === 0 && submitError">
              At least one permission must be selected.
            </div>
            <div class="form-text small text-muted" *ngIf="(form.permissionIds?.length || 0) > 0">
              {{ form.permissionIds?.length || 0 }} permission(s) selected
            </div>
          </div>

          <div *ngIf="submitError" class="alert alert-danger small">{{ submitError }}</div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelForm()" [disabled]="isSaving">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" (click)="submitForm()" [disabled]="isSaving || !form.name || (form.permissionIds?.length || 0) === 0">
          <app-loading-spinner *ngIf="isSaving" size="sm" class="me-2 d-inline-block"></app-loading-spinner>
          {{ editId ? 'Update Role' : 'Create Role' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
