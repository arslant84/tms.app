<div class="settings-card">
  <div class="card-header">
    <h4 class="card-title">
      <i class="bi bi-diagram-3"></i>
      Workflow Configuration
    </h4>
    <p class="card-description">Manage workflow modules and steps</p>
  </div>
  <div class="card-body">
    <div *ngIf="isLoading" class="d-flex justify-content-center py-4">
      <app-loading-spinner size="md"></app-loading-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <div class="accordion" id="workflowModules">
        <div class="accordion-item" *ngFor="let m of modules; let i = index">
          <h2 class="accordion-header" [id]="'heading' + i">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse' + i" aria-expanded="false" [attr.aria-controls]="'collapse' + i">
              <div class="me-auto">
                <div class="fw-semibold">{{ m.name }}</div>
                <div class="small text-muted">{{ m.description }}</div>
              </div>
              <button class="btn btn-sm btn-primary ms-2" type="button" (click)="openCreate(m.id)">Add Step</button>
            </button>
          </h2>
          <div [id]="'collapse' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'heading' + i" data-bs-parent="#workflowModules">
            <div class="accordion-body">
              <div class="list-group">
                <div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let s of m.steps">
                  <div>
                    <div class="fw-semibold">{{ s.order }}. {{ s.name }}</div>
                    <div class="small text-muted">Approver {{ s.approverRole || s.approverRoleId }}</div>
                    <div class="small text-muted" *ngIf="s.escalationRole || s.escalationRoleId">Escalation {{ s.escalationRole || s.escalationRoleId }} in {{ s.escalationHours || 'n/a' }} hours</div>
                  </div>
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" (click)="openEdit(m.id, s)">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" (click)="deleteStep(s)">Delete</button>
                  </div>
                </div>
                <div class="list-group-item text-muted text-center" *ngIf="m.steps.length === 0">No steps</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="showForm" class="mt-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Step Name</label>
            <input class="form-control" [(ngModel)]="form.name" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Approver Role Id</label>
            <input class="form-control" [(ngModel)]="form.approverRoleId" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Escalation Role Id</label>
            <input class="form-control" [(ngModel)]="form.escalationRoleId" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Escalation Hours</label>
            <input type="number" class="form-control" [(ngModel)]="form.escalationHours" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Order</label>
            <input type="number" class="form-control" [(ngModel)]="form.order" />
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-secondary" (click)="cancelForm()" [disabled]="isSaving">Cancel</button>
          <button class="btn btn-primary" (click)="submitForm()" [disabled]="isSaving">
            <app-loading-spinner *ngIf="isSaving" size="sm" class="me-2 d-inline-block"></app-loading-spinner>
            {{ editStepId ? 'Update Step' : 'Create Step' }}
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</div>
