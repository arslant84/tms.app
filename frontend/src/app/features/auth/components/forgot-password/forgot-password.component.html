<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-container">
        <h1 class="app-logo">{{ applicationName$ | async }}</h1>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your email address and we'll send you a reset link</p>
    </div>

    <div class="auth-body">
      <!-- Success Message -->
      <div *ngIf="success" class="alert alert-success" role="alert">
        {{ success }}
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
        <!-- Email Field -->
        <div class="mb-4">
          <label for="email" class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              autocomplete="email"
              [(ngModel)]="email"
              placeholder="name@example.com"
              required
              email
              [disabled]="loading"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loading || !forgotPasswordForm.form.valid"
        >
          <span *ngIf="!loading">Send Reset Link</span>
          <span *ngIf="loading">
            <app-loading-spinner size="sm" class="me-2 d-inline-block"></app-loading-spinner>
            Sending...
          </span>
        </button>

        <!-- Back to Login -->
        <div class="text-center mt-4">
          <a routerLink="/auth/login" class="text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
