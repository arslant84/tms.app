<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="mfa-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2>Two-Factor Verification</h2>
      <p>Enter the 6-digit code from your authenticator app</p>
    </div>

    <div class="auth-body">
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group mb-4">
          <label for="otp" class="form-label">Authentication Code</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-phone"></i></span>
            <input
              type="text"
              class="form-control otp-input"
              id="otp"
              formControlName="otp"
              placeholder="000000"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
              [ngClass]="{'is-invalid': otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched}"
            >
          </div>
          <div *ngIf="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched" class="invalid-feedback d-block mt-1 ms-1">
            <div *ngIf="otpForm.get('otp')?.errors?.['required']">Code is required</div>
            <div *ngIf="otpForm.get('otp')?.errors?.['pattern']">Enter the 6-digit code from your app</div>
          </div>
          <div class="form-text mt-2">
            <i class="bi bi-clock me-1"></i>Codes refresh every 30 seconds
          </div>
        </div>

        <div class="d-grid mb-3">
          <button
            type="submit"
            class="btn btn-primary btn-lg btn-gradient"
            [disabled]="otpForm.invalid || isSubmitting"
          >
            <app-loading-spinner *ngIf="isSubmitting" size="sm" class="me-2 d-inline-block"></app-loading-spinner>
            {{ isSubmitting ? 'Verifying...' : 'Verify Code' }}
          </button>
        </div>

        <div class="text-center">
          <button type="button" class="btn btn-link text-muted small p-0" (click)="backToLogin()">
            <i class="bi bi-arrow-left me-1"></i>Back to login
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
