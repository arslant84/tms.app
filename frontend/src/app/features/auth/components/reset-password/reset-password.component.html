<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-container">
        <h1 class="app-logo">SynTra</h1>
      </div>
      <h2>Set New Password</h2>
      <p>Enter your new password below</p>
    </div>

    <div class="auth-body">
      <!-- Success Message -->
      <div *ngIf="success" class="alert alert-success" role="alert">
        {{ success }}
        <div class="mt-2 small">
          <i class="bi bi-arrow-right me-1"></i>
          Redirecting to login...
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
        <div *ngIf="invalidToken" class="mt-2">
          <a routerLink="/auth/forgot-password" class="alert-link">Request a new password reset link</a>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm" *ngIf="!success && !invalidToken">
        <!-- New Password Field -->
        <div class="mb-4">
          <label for="newPassword" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              class="form-control"
              id="newPassword"
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="Enter new password"
              required
              minlength="8"
              [disabled]="loading"
            >
          </div>
          <small class="form-text text-muted">Must be at least 8 characters</small>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
          <label for="newPasswordConfirm" class="form-label">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock-fill"></i>
            </span>
            <input
              type="password"
              class="form-control"
              id="newPasswordConfirm"
              name="newPasswordConfirm"
              [(ngModel)]="newPasswordConfirm"
              placeholder="Confirm new password"
              required
              [disabled]="loading"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loading || !resetPasswordForm.form.valid"
        >
          <span *ngIf="!loading">Reset Password</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Resetting...
          </span>
        </button>

        <!-- Back to Login -->
        <div class="text-center mt-4">
          <a routerLink="/auth/login" class="text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Login
          </a>
        </div>
      </form>

      <!-- If token invalid, show action link -->
      <div *ngIf="invalidToken && !success" class="text-center">
        <a routerLink="/auth/forgot-password" class="btn btn-outline-primary w-100">
          Request New Reset Link
        </a>
        <div class="text-center mt-4">
          <a routerLink="/auth/login" class="text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
