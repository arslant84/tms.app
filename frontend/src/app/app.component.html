<!-- Global loading indicator for page navigation -->
<app-loading-spinner
  *ngIf="loading$ | async"
  size="lg"
  [fullScreen]="true"
  message="Loading...">
</app-loading-spinner>

<!-- Connection lost - retrying in the background, current page stays as-is -->
<div class="connection-issue-banner" *ngIf="connectionIssue$ | async">
  <i class="bi bi-wifi-off"></i>
  Connection lost. Retrying...
</div>

<!-- Toast notifications -->
<app-toast-container></app-toast-container>

<!-- Confirmation dialog -->
<app-confirmation-dialog></app-confirmation-dialog>
<app-root-modal></app-root-modal>

<!-- Main application container -->
<div class="app-container">
  <!-- Show main layout with sidebar for authenticated (or still-pending) users.
       Defaulting the pending (not-yet-resolved) case here too - rather than to the
       login container below - means a refresh mid connection-retry keeps the user's
       current page/layout instead of flashing to the login screen while we wait. -->
  <ng-container *ngIf="(isAuthenticated$ | async) !== false">
    <router-outlet></router-outlet>
  </ng-container>

  <!-- Clean login page for visitors (no sidebar/header/footer) -->
  <ng-container *ngIf="(isAuthenticated$ | async) === false">
    <div class="login-container">
      <router-outlet></router-outlet>
    </div>
  </ng-container>
</div>
