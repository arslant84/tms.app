<!-- Global loading indicator for page navigation -->
<app-loading-spinner
  *ngIf="loading$ | async"
  size="lg"
  fullScreen="true"
  message="Loading...">
</app-loading-spinner>

<!-- Toast notifications -->
<app-toast-container></app-toast-container>

<!-- Confirmation dialog -->
<app-confirmation-dialog></app-confirmation-dialog>
<app-root-modal></app-root-modal>

<!-- Main application container -->
<div class="app-container">
  <!-- Show main layout with sidebar for authenticated users -->
  <ng-container *ngIf="(isAuthenticated$ | async)">
    <router-outlet></router-outlet>
  </ng-container>

  <!-- Clean login page for visitors (no sidebar/header/footer) -->
  <ng-container *ngIf="!(isAuthenticated$ | async)">
    <div class="login-container">
      <router-outlet></router-outlet>
    </div>
  </ng-container>
</div>
