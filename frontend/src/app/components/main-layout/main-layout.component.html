<div class="layout-container" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Sidebar -->
  <div class="sidebar-wrapper">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <img [src]="logoPath" alt="TMS Logo" class="logo"/>
          <h2 class="logo-text">PC(T)SB</h2>
        </div>
      </div>
      <app-sidebar></app-sidebar>
    </div>
  </div>
  
  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Header -->
    <div class="header-wrapper">
      <app-header (toggleSidebarEvent)="toggleSidebar()"></app-header>
    </div>
    
    <!-- Content Area -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
    
    <!-- Footer -->
    <div class="footer-wrapper">
      <app-footer></app-footer>
    </div>
  </div>
  
  <!-- Right Panel (Optional) -->
  <div class="right-panel" *ngIf="showRightPanel">
    <app-right-panel 
      [requestId]="selectedRequestId" 
      [requestType]="selectedRequestType"
      (close)="closeRightPanel()"></app-right-panel>
  </div>
  
  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" *ngIf="!isSidebarCollapsed" (click)="toggleSidebar()"></div>
</div>
