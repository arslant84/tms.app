<!doctype html>
<html lang="en" style="margin: 0; padding: 0; width: 100%; height: 100%">
  <head>
    <meta charset="utf-8" />
    <title>TMS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Travel Management System - submit, approve, and track travel, accommodation, transport, and visa requests."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Preload: this is the app's full-screen loading indicator, shown while
         Angular bootstraps - it's frequently the LCP element since it paints
         before any real page content exists (see loading-spinner.component). -->
    <link rel="preload" as="image" href="/img/pet-loading.webp" fetchpriority="high" />
    <!-- Raleway font loaded locally via angular.json -->
    <!-- Bootstrap Icons loaded locally via angular.json -->
    <!-- Bootstrap JS loaded locally via angular.json scripts -->
    <style>
      /* Critical CSS to prevent layout shift and edge gaps */
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      app-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; width: 100%; height: 100%">
    <app-root></app-root>
  </body>
</html>
