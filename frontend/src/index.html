<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TMS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Travel Management System - submit, approve, and track travel, accommodation, transport, and visa requests."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Type: Segoe UI / system-font stack (see styles/_variables.scss $font-primary) - no webfont to load -->
    <!-- Bootstrap Icons loaded locally via angular.json -->
    <!-- Bootstrap JS loaded locally via angular.json scripts -->
    <style>
      /* Critical CSS to prevent layout shift and edge gaps before Angular's
         bundled styles.css loads (html/body sizing repeated there too, as a
         fallback if this inline block is ever stripped by a CSP change).
         The app-root box model below is only needed pre-boot - once Angular
         renders, app.component.scss's :host owns it (single source, no
         !important needed there - see the comment in that file). */
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      app-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
