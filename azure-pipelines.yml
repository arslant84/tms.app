trigger:
  branches:
    include:
      - main
      - master
      - develop
      - chore/*

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0

- script: |
    echo "Configuring git..."
    git config --global user.email "azure-mirror@pipeline"
    git config --global user.name "Azure Repos Mirror"

    echo "Adding Azure Repo as remote..."
    git remote add azure https://$(System.AccessToken)@dev.azure.com/arslantekayev/Travel%20Management%20System/_git/Travel%20Management%20System

    echo "Pushing all branches and tags to Azure Repos..."
    git push azure --all --force
    git push azure --tags --force
  displayName: 'Mirror GitHub → Azure Repos'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)