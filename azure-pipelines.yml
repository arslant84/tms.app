trigger:
  branches:
    include:
      - main
      - master
      - develop
      - chore/*

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0

- script: |
    echo "Configuring git..."
    git config --global user.email "azure-mirror@pipeline"
    git config --global user.name "Azure Repos Mirror"

    echo "Adding Azure remote..."
    git remote remove azure 2>/dev/null || true
    git remote add azure https://anything:$(AZURE_DEVOPS_PAT)@dev.azure.com/arslantekayev/Travel%20Management%20System/_git/Travel%20Management%20System

    echo "Pushing main and other important branches..."
    git push azure main --force
    git push azure master --force 2>/dev/null || true
    git push azure develop --force 2>/dev/null || true
    git push azure --tags --force
  displayName: 'Safe Mirror GitHub → Azure Repos'
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)