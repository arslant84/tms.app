name: CI — Security & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend security & quality ──────────────────────────────────────────────
  backend:
    name: Backend — SAST & Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CTRL-0000001191 — OSS vulnerability scanning
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict \
            --ignore-vuln GHSA-wj6h-64fc-37mp \
            --ignore-vuln GHSA-rf74-v2fm-23pw \
            --ignore-vuln GHSA-68j8-pq59-fqgm \
            --ignore-vuln PYSEC-2026-97 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln GHSA-jr27-m4p2-rc6r \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln PYSEC-2026-2132

      # CTRL-0000001033 / CTRL-0000001190 — SAST
      - name: Static analysis (Bandit)
        run: |
          pip install bandit
          bandit -r . -c bandit.yaml -ll

      # Verify migrations are consistent (no missing migrations)
      - name: Check for missing migrations
        env:
          SECRET_KEY: ci-placeholder-secret-key-not-used-in-tests
          DATABASE_URL: sqlite:///ci.db
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:4200
          CSRF_TRUSTED_ORIGINS: http://localhost:4200
          ENCRYPTION_KEY: ''
          SIEM_LOG_DIR: /tmp
          PRIVACY_POLICY_VERSION: '1.0'
        run: python manage.py migrate --check || echo "Migrations pending — check before merging"

  # ── Frontend quality ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # CTRL-0000001191 — npm dependency vulnerability scan
      - name: npm audit
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build (production)
        run: npm run build -- --configuration production
